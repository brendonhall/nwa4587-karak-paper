name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --group dev
      - uses: actions/cache@v4
        with:
          path: .venv/lib/python3.*/.cache
          key: ${{ runner.os }}-karak-lut-${{ hashFiles('uv.lock') }}
      - run: uv run pytest -q
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync
      - uses: actions/cache@v4
        with:
          path: .venv/lib/python3.*/.cache
          key: ${{ runner.os }}-karak-lut-${{ hashFiles('uv.lock') }}
      - run: uv run paper synth smoke
      # 19,51 is synth.SYNTH_TIMA_DX/DY
      - run: uv run paper figures --h5 smoke/results/paperflow.h5 --out smoke/results --data smoke/data --tima-offset 19,51
      - run: uv run paper numbers --h5 smoke/results/paperflow.h5 --out smoke/results --data smoke/data
      - name: Check outputs
        run: |
          test -s smoke/results/numbers.tex
          test -s smoke/results/figures/fig2_fingerprints.pdf
          test -s smoke/results/tables/table1_params.tex
          test -s smoke/results/tables/table2_phases.csv
          test -s smoke/results/tables/table2_phases.tex
          test -s smoke/results/figures/fig3_phase_comparison.pdf
          test -s smoke/results/figures/fig4_agreement_map.pdf
          test -s smoke/results/figures/fig5_pyroxene_tima.pdf
          test -s smoke/results/tables/table3_correspondence.tex
          test -s smoke/results/tables/table4_concordance.tex
          test -s smoke/results/tables/table4_concordance.csv
          test -s smoke/results/figures/fig1_workflow.pdf
          test -s smoke/results/figures/fig6_xenotime_callout.pdf
          test -s smoke/results/figures/fig7_pyroxene_refinement.pdf
          test -s smoke/results/figures/fig8_lamellae.pdf
          test -s smoke/results/tables/lamellae_grain_table.csv
          test -s smoke/results/numbers/colormap.json
